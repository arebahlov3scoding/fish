<!-- Sign In Form -->
<div class="signin-container">
  <h2 class="text-center mb-4">🔐 Admin Sign In</h2>
  <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
  <form id="signinForm">
    <input type="email" id="email" class="form-control" placeholder="Admin email" required />
    <input type="password" id="password" class="form-control" placeholder="Password" required />
    <button type="submit" id="signinBtn" class="btn-signin">Sign In</button>
  </form>
  <div class="text-center mt-3">
    <a href="blogs.html" class="text-muted">← Back to Blogs</a>
  </div>
</div>

<!-- Firebase SDK Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAPfP7FvUlNa5of_hv4pEMYBrGZzjXcLyM",
    authDomain: "ngujublogs.firebaseapp.com",
    projectId: "ngujublogs",
    storageBucket: "ngujublogs.appspot.com",
    messagingSenderId: "206754259481",
    appId: "1:206754259481:web:44579469aea3575bbfc088"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Check if user is already signed in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // User is signed in, redirect to admin dashboard
      window.location.href = "admin.html";
    }
  });

  // Handle sign in
  document.getElementById("signinForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorDiv = document.getElementById("errorMessage");
    
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // Success - redirect to admin dashboard
      window.location.href = "admin.html";
    } catch (error) {
      errorDiv.textContent = "Sign in failed: " + error.message;
      errorDiv.style.display = "block";
    }
  });
</script>
